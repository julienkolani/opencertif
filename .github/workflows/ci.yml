# CI : tests à chaque push et pull request.
# CD : à chaque push sur main (ou tag v*), construction et publication des
# images Docker sur GitHub Container Registry, SEULEMENT si les tests passent.
# Aucun déploiement automatique : le serveur récupère les images à la main
# (docker compose pull, voir README « Mises à jour »).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Même version que les images (api/Dockerfile, front/Dockerfile).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest -q

      - name: Vérifier la syntaxe du front
        run: python -m compileall -q front

  images:
    name: Image ${{ matrix.service }}
    needs: tests
    # Pas d'image pour les pull requests : seulement main et les tags.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, front]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/opencertif-${{ matrix.service }}
          # latest = dernier main ; sha-xxxxxxx = chaque commit (retour arrière
          # possible) ; 1.2.3 / 1.2 = tags git v1.2.3.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
