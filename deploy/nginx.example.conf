# OpenCertif : configuration nginx (reverse proxy)
#
# Remplacez DOMAIN par votre domaine réel (ex: opencertif.org) dans les
# trois blocs ci-dessous, puis copiez ce fichier dans
# /etc/nginx/sites-available/opencertif.conf et activez-le :
#
#   sudo ln -s /etc/nginx/sites-available/opencertif.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# --- HTTPS / Let's Encrypt --------------------------------------------
# Ce fichier ne déclare que du HTTP (port 80). Une fois les trois blocs
# actifs et les DNS pointés sur ce serveur, générez les certificats avec
# certbot (plugin nginx) pour chaque sous-domaine :
#
#   sudo certbot --nginx -d certifs.DOMAIN -d api.DOMAIN -d auth.DOMAIN
#
# certbot réécrit automatiquement chaque bloc pour ajouter `listen 443 ssl;`,
# les directives ssl_certificate(_key) et la redirection HTTP -> HTTPS.
# Inutile de les pré-écrire à la main ici.
# ------------------------------------------------------------------------

# --- Front (Streamlit) : certifs.DOMAIN ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name certifs.DOMAIN;

    # Uploads batch (Excel) + PDF de vérification : le défaut nginx (1m) est trop juste.
    client_max_body_size 25m;

    location / {
        proxy_pass http://localhost:8501;
        proxy_http_version 1.1;

        # Streamlit repose sur un WebSocket (st.stream) pour la réactivité live.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# --- API (FastAPI) : api.DOMAIN -----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.DOMAIN;

    # Génération batch (Excel) + upload PDF de vérification.
    client_max_body_size 25m;

    location / {
        proxy_pass http://localhost:8008;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une génération batch de gros fichier Excel peut prendre du temps.
        proxy_read_timeout 300;
    }
}

# --- Keycloak (auth) : auth.DOMAIN --------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name auth.DOMAIN;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # KC_HOSTNAME=auth.DOMAIN dans .env doit correspondre à ce nom pour que
        # l'issuer OIDC renvoyé par Keycloak soit cohérent côté navigateur et serveur.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
